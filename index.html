<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0"
>

<meta name="apple-mobile-web-app-capable" content="yes">

<title>부엉이 키우기</title>

<style>

/* ==================================================
   기본
================================================== */

*{
    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;

    -webkit-touch-callout:none;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    min-height:100%;

    background:#111;

    overflow-x:hidden;
}

body{

    display:flex;

    justify-content:center;
    align-items:flex-start;

    padding:18px;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
}


/* ==================================================
   게임 전체
================================================== */

#game{

    position:relative;

    width:min(94vw,520px);

    aspect-ratio:1 / 1;

    overflow:hidden;

    background:#33231c;

    border:
        8px solid #f4dfc0;

    border-radius:42px;

    box-shadow:

        0 0 0 5px #211713,

        inset 0 0 0 4px #654733,

        0 15px 40px rgba(0,0,0,.55);
}


/* ==================================================
   픽셀 질감
================================================== */

#game::after{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    opacity:.13;

    background-image:

        linear-gradient(
            rgba(255,255,255,.2) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.2) 1px,
            transparent 1px
        );

    background-size:6px 6px;

    z-index:90;
}


/* ==================================================
   배경
================================================== */

.wall{

    position:absolute;

    inset:0;

    background:

        linear-gradient(
            90deg,
            rgba(0,0,0,.08),
            transparent 40%,
            rgba(0,0,0,.12)
        ),

        #3a2921;
}


/* ==================================================
   창문
================================================== */

.window{

    position:absolute;

    right:8%;

    top:8%;

    width:38%;

    height:28%;

    background:

        radial-gradient(
            circle at 70% 35%,
            #f3c768 0 7%,
            transparent 8%
        ),

        radial-gradient(
            circle at 25% 23%,
            #d7c89d 0 2%,
            transparent 3%
        ),

        radial-gradient(
            circle at 62% 17%,
            #d7c89d 0 2%,
            transparent 3%
        ),

        #10182a;

    border:
        6px solid #211713;

    box-shadow:
        inset 0 0 0 3px #674732;

    overflow:hidden;
}

.window::before{

    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:40%;

    background:#182235;

    clip-path:

        polygon(
            0 70%,
            15% 30%,
            28% 65%,
            45% 10%,
            60% 60%,
            77% 25%,
            100% 70%,
            100% 100%,
            0 100%
        );
}


/* ==================================================
   달
================================================== */

.moon{

    position:absolute;

    width:35px;
    height:35px;

    left:13%;
    top:17%;

    border-radius:50%;

    background:#f5c86d;

    box-shadow:
        0 0 14px rgba(245,200,109,.25);
}

.moon::after{

    content:"";

    position:absolute;

    width:35px;
    height:35px;

    left:9px;
    top:-5px;

    border-radius:50%;

    background:#10182a;
}


/* ==================================================
   램프
================================================== */

.lamp{

    position:absolute;

    right:5%;

    top:35%;

    width:14%;

    height:18%;
}

.lamp::before{

    content:"";

    position:absolute;

    left:12%;
    top:0;

    width:76%;
    height:52%;

    border-radius:
        50% 50% 25% 25%;

    background:#ad7a48;

    border:
        4px solid #4a3020;

    box-shadow:
        0 0 20px rgba(248,191,87,.65);
}

.lamp::after{

    content:"";

    position:absolute;

    left:47%;

    top:48%;

    width:7%;

    height:45%;

    background:#4a3020;
}


/* ==================================================
   상단 제목
================================================== */

.title{

    position:absolute;

    left:6%;
    top:7%;

    padding:
        9px 15px;

    background:#241915;

    border:
        4px solid #694934;

    border-radius:18px;

    color:#f6e5ca;

    font-size:
        clamp(19px,5.5vw,30px);

    font-weight:900;

    letter-spacing:1px;

    z-index:10;
}

.title .heart{

    color:#e97979;
}


/* ==================================================
   레벨
================================================== */

.level{

    position:absolute;

    left:8%;

    top:20%;

    color:#f3e2c8;

    font-size:
        clamp(13px,3.8vw,19px);

    font-weight:900;

    z-index:10;
}


/* ==================================================
   상태
================================================== */

.stats{

    position:absolute;

    left:7%;

    top:27%;

    width:48%;

    display:flex;

    flex-direction:column;

    gap:7px;

    z-index:10;
}

.stat{

    display:flex;

    align-items:center;

    gap:5px;
}

.stat-icon{

    width:22px;

    text-align:center;

    color:#f6e3c6;

    font-size:17px;

    font-weight:bold;
}

.bar{

    flex:1;

    height:13px;

    background:#49382e;

    border:
        2px solid #211713;

    border-radius:8px;

    overflow:hidden;
}

.fill{

    height:100%;

    width:50%;

    transition:
        width .25s ease;
}

.hp{
    background:#e97676;
}

.hunger{
    background:#efb44e;
}

.mood{
    background:#a9d36e;
}

.number{

    width:25px;

    color:#f5e3c8;

    font-size:12px;

    font-weight:900;

    text-align:right;
}


/* ==================================================
   방
================================================== */

.room{

    position:absolute;

    left:5%;

    right:5%;

    top:38%;

    bottom:24%;

    overflow:hidden;

    z-index:5;
}


/* ==================================================
   선반
================================================== */

.shelf{

    position:absolute;

    left:0;

    bottom:5%;

    width:29%;

    height:17%;

    background:#5d3c28;

    border:
        4px solid #2c1d16;
}

.shelf::before{

    content:"";

    position:absolute;

    left:10%;

    top:-5px;

    width:8%;

    height:110%;

    background:#2d1d16;
}

.shelf::after{

    content:"";

    position:absolute;

    right:10%;

    top:-5px;

    width:8%;

    height:110%;

    background:#2d1d16;
}


/* ==================================================
   식물
================================================== */

.plant{

    position:absolute;

    left:5%;

    bottom:19%;

    font-size:
        clamp(25px,7vw,45px);

    filter:
        saturate(.75);
}


/* ==================================================
   책
================================================== */

.books{

    position:absolute;

    left:17%;

    bottom:8%;

    font-size:
        clamp(19px,5vw,30px);
}


/* ==================================================
   둥지
================================================== */

.nest{

    position:absolute;

    left:50%;

    bottom:1%;

    transform:
        translateX(-50%);

    width:48%;

    height:30%;

    border:
        7px solid #352219;

    border-radius:
        50%;

    background:

        repeating-linear-gradient(
            20deg,
            #70452c 0 5px,
            #9a5d35 5px 9px
        );

    box-shadow:
        inset 0 -12px 0 #4c2f20;
}


/* ==================================================
   알
================================================== */

.egg{

    position:absolute;

    left:50%;

    bottom:16%;

    transform:
        translateX(-50%);

    width:28%;

    aspect-ratio:.78;

    z-index:15;

    cursor:pointer;

    transition:
        transform .12s ease;
}

.egg:active{

    transform:
        translateX(-50%)
        scale(.9);
}

.egg-body{

    position:absolute;

    inset:0;

    border:
        6px solid #35251d;

    border-radius:
        50% 50% 46% 46% /
        55% 55% 43% 43%;

    background:

        radial-gradient(
            circle at 30% 34%,
            #aaa09a 0 4%,
            transparent 5%
        ),

        radial-gradient(
            circle at 65% 23%,
            #aaa09a 0 4%,
            transparent 5%
        ),

        radial-gradient(
            circle at 48% 62%,
            #c5b7ae 0 5%,
            transparent 6%
        ),

        #f3e8d7;

    box-shadow:
        inset -7px -8px 0 rgba(100,70,50,.1);
}


/* ==================================================
   알 흔들림
================================================== */

.egg.shake{

    animation:
        eggShake .25s ease;
}

@keyframes eggShake{

    0%{
        transform:
            translateX(-50%)
            rotate(0);
    }

    25%{
        transform:
            translateX(-50%)
            rotate(-7deg);
    }

    50%{
        transform:
            translateX(-50%)
            rotate(7deg);
    }

    75%{
        transform:
            translateX(-50%)
            rotate(-4deg);
    }

    100%{
        transform:
            translateX(-50%)
            rotate(0);
    }
}


/* ==================================================
   부엉이
================================================== */

.owl{

    position:absolute;

    left:50%;

    bottom:13%;

    transform:
        translateX(-50%)
        scale(0);

    width:43%;

    aspect-ratio:1;

    z-index:16;

    cursor:pointer;

    transition:
        transform .35s
        cubic-bezier(.2,1.4,.4,1);
}

.owl.show{

    transform:
        translateX(-50%)
        scale(1);
}

.owl:active{

    transform:
        translateX(-50%)
        scale(.92);
}


/* 몸 */

.owl-body{

    position:absolute;

    left:14%;
    top:16%;

    width:72%;
    height:70%;

    background:#956447;

    border:
        6px solid #34231a;

    border-radius:
        48% 48% 43% 43%;
}


/* 얼굴 */

.face{

    position:absolute;

    left:19%;
    top:17%;

    width:62%;
    height:48%;

    background:#f0ddc2;

    border:
        5px solid #34231a;

    border-radius:50%;
}


/* 눈 */

.eye{

    position:absolute;

    top:30%;

    width:13%;

    aspect-ratio:1;

    border-radius:50%;

    background:#201914;

    z-index:3;
}

.eye.left{
    left:27%;
}

.eye.right{
    right:27%;
}


/* 눈 하이라이트 */

.eye::after{

    content:"";

    position:absolute;

    width:25%;
    height:25%;

    background:#fff;

    border-radius:50%;

    left:20%;
    top:16%;
}


/* 부리 */

.beak{

    position:absolute;

    left:50%;
    top:48%;

    transform:
        translateX(-50%);

    width:0;
    height:0;

    border-left:
        9px solid transparent;

    border-right:
        9px solid transparent;

    border-top:
        15px solid #d5983f;

    z-index:4;
}


/* 배 */

.belly{

    position:absolute;

    left:28%;
    bottom:7%;

    width:44%;
    height:43%;

    background:#d5b58a;

    border-radius:50%;
}


/* 날개 */

.wing{

    position:absolute;

    top:40%;

    width:25%;
    height:35%;

    background:#81543b;

    border:
        5px solid #34231a;

    border-radius:60%;
}

.wing.left{
    left:3%;
    transform:rotate(18deg);
}

.wing.right{
    right:3%;
    transform:rotate(-18deg);
}


/* ==================================================
   부엉이 흔들림
================================================== */

.owl.jump{

    animation:
        owlJump .35s ease;
}

@keyframes owlJump{

    0%{
        margin-top:0;
    }

    40%{
        margin-top:-12px;
    }

    100%{
        margin-top:0;
    }
}


/* ==================================================
   말풍선
================================================== */

.bubble{

    position:absolute;

    left:50%;
    top:1%;

    transform:
        translateX(-50%)
        scale(0);

    padding:
        6px 11px;

    min-width:65px;

    background:#fff1da;

    color:#302119;

    border:
        4px solid #39281f;

    border-radius:15px;

    font-size:
        clamp(15px,4.3vw,24px);

    font-weight:900;

    text-align:center;

    white-space:nowrap;

    z-index:40;

    transition:
        transform .15s
        cubic-bezier(.2,1.4,.4,1);
}

.bubble.show{

    transform:
        translateX(-50%)
        scale(1);
}

.bubble::after{

    content:"";

    position:absolute;

    left:50%;

    bottom:-10px;

    transform:
        translateX(-50%);

    border-left:
        7px solid transparent;

    border-right:
        7px solid transparent;

    border-top:
        10px solid #39281f;
}


/* ==================================================
   터치 이펙트
================================================== */

.effect{

    position:absolute;

    pointer-events:none;

    z-index:60;

    font-size:
        clamp(18px,5vw,30px);

    font-weight:900;

    animation:
        effectUp .75s ease-out forwards;
}

@keyframes effectUp{

    0%{
        opacity:1;

        transform:
            translate(-50%,-20%)
            scale(.7);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-150%)
            scale(1.3);
    }
}


/* ==================================================
   하단 버튼
================================================== */

.buttons{

    position:absolute;

    left:5%;
    right:5%;

    bottom:4%;

    height:17%;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;

    z-index:50;
}

.game-btn{

    border:
        5px solid #5b3d29;

    border-radius:25px;

    background:#e8c38c;

    color:#39261c;

    box-shadow:
        inset 0 -5px 0 #bb8952;

    font-size:
        clamp(11px,3.1vw,16px);

    font-weight:900;

    cursor:pointer;

    touch-action:manipulation;

    padding:3px;
}

.game-btn:active{

    transform:
        translateY(3px);

    box-shadow:
        inset 0 -2px 0 #bb8952;
}

.game-btn .icon{

    display:block;

    font-size:
        clamp(22px,6vw,34px);

    line-height:1;

    margin-bottom:3px;
}


/* ==================================================
   시작 화면
================================================== */

.start{

    position:absolute;

    inset:0;

    z-index:100;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:#2b1e18;

    color:#f4e2c6;
}

.start-egg{

    width:25%;

    aspect-ratio:.78;

    border:
        6px solid #3a291f;

    border-radius:
        50% 50% 46% 46%;

    background:#f3e8d7;

    margin-bottom:18px;

    animation:
        startEgg 1.6s ease-in-out infinite;
}

@keyframes startEgg{

    50%{
        transform:
            translateY(-6px);
    }
}

.start h1{

    margin:0;

    font-size:
        clamp(24px,8vw,42px);

    letter-spacing:1px;
}

.start p{

    margin:
        8px 0 20px;

    font-size:13px;

    opacity:.65;
}

.start-button{

    border:
        5px solid #704d31;

    border-radius:20px;

    background:#e8c38c;

    color:#39261c;

    padding:
        11px 30px;

    font-size:18px;

    font-weight:900;

    cursor:pointer;
}

.start-button:active{

    transform:
        translateY(3px);
}


/* ==================================================
   숨김
================================================== */

.hidden{

    display:none !important;
}


/* ==================================================
   모바일 보정
================================================== */

@media(max-width:360px){

    body{
        padding:10px;
    }

    #game{

        border-width:7px;

        border-radius:34px;
    }

    .buttons{

        gap:4px;
    }

    .game-btn{

        border-width:4px;

        border-radius:19px;
    }
}

</style>
</head>


<body>


<div id="game">

    <div class="wall"></div>


    <!-- ==========================================
         배경
    =========================================== -->

    <div class="window">

        <div class="moon"></div>

    </div>

    <div class="lamp"></div>


    <!-- ==========================================
         상단 정보
    =========================================== -->

    <div class="title">

        부엉이

        <span class="heart">♥</span>

    </div>


    <div
        class="level"
        id="levelText"
    >
        Lv. 1 (알)
    </div>


    <!-- ==========================================
         상태
    =========================================== -->

    <div class="stats">


        <div class="stat">

            <div class="stat-icon">
                ♥
            </div>

            <div class="bar">

                <div
                    class="fill hp"
                    id="hpBar"
                ></div>

            </div>

            <div
                class="number"
                id="hpNumber"
            >
                50
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                ●
            </div>

            <div class="bar">

                <div
                    class="fill hunger"
                    id="hungerBar"
                ></div>

            </div>

            <div
                class="number"
                id="hungerNumber"
            >
                50
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                ☺
            </div>

            <div class="bar">

                <div
                    class="fill mood"
                    id="moodBar"
                ></div>

            </div>

            <div
                class="number"
                id="moodNumber"
            >
                50
            </div>

        </div>

    </div>


    <!-- ==========================================
         방
    =========================================== -->

    <div
        class="room"
        id="room"
    >


        <div class="shelf"></div>


        <div class="plant">
            🌿
        </div>


        <div class="books">
            📚
        </div>


        <!-- 둥지 -->

        <div class="nest"></div>


        <!-- ======================================
             알
        ======================================= -->

        <div
            class="egg"
            id="egg"
            onclick="touchEgg(event)"
        >

            <div class="egg-body"></div>

        </div>


        <!-- ======================================
             부엉이
        ======================================= -->

        <div
            class="owl"
            id="owl"
            onclick="touchOwl(event)"
        >

            <div class="owl-body"></div>

            <div class="face"></div>

            <div class="eye left"></div>

            <div class="eye right"></div>

            <div class="beak"></div>

            <div class="belly"></div>

            <div class="wing left"></div>

            <div class="wing right"></div>

        </div>


        <!-- ======================================
             말풍선
        ======================================= -->

        <div
            class="bubble"
            id="bubble"
        >
            *⸌☻ັ⸍*
        </div>


    </div>


    <!-- ==========================================
         하단 버튼
    =========================================== -->

    <div class="buttons">


        <button
            class="game-btn"
            onclick="feed()"
        >

            <span class="icon">
                🍖
            </span>

            먹이주기

        </button>


        <button
            class="game-btn"
            onclick="play()"
        >

            <span class="icon">
                🪶
            </span>

            놀아주기

        </button>


        <button
            class="game-btn"
            onclick="pet()"
        >

            <span class="icon">
                ♥
            </span>

            쓰다듬기

        </button>


    </div>


    <!-- ==========================================
         시작 화면
    =========================================== -->

    <div
        class="start"
        id="startScreen"
    >

        <div class="start-egg"></div>

        <h1>
            부엉이 키우기
        </h1>

        <p>
            작은 알에서 시작됩니다.
        </p>

        <button
            class="start-button"
            onclick="startGame()"
        >
            시작
        </button>

    </div>


</div>



<script>

/* ==================================================
   게임 데이터
================================================== */

const game = {

    started:false,

    hatched:false,

    touches:0,

    hp:50,

    hunger:50,

    mood:50,

    level:1

};


/* ==================================================
   시작
================================================== */

function startGame(){

    game.started=true;

    document
        .getElementById("startScreen")
        .classList
        .add("hidden");


    showBubble(
        "*⸌☻ັ⸍*"
    );


    setTimeout(function(){

        showBubble(
            "•ᴗ•"
        );

    },900);

}


/* ==================================================
   숫자 제한
================================================== */

function clamp(value){

    return Math.max(
        0,
        Math.min(
            100,
            value
        )
    );

}


/* ==================================================
   상태 업데이트
================================================== */

function updateStats(){

    game.hp =
        clamp(game.hp);

    game.hunger =
        clamp(game.hunger);

    game.mood =
        clamp(game.mood);


    document
        .getElementById("hpBar")
        .style
        .width =
        game.hp + "%";


    document
        .getElementById("hungerBar")
        .style
        .width =
        game.hunger + "%";


    document
        .getElementById("moodBar")
        .style
        .width =
        game.mood + "%";


    document
        .getElementById("hpNumber")
        .textContent =
        Math.round(game.hp);


    document
        .getElementById("hungerNumber")
        .textContent =
        Math.round(game.hunger);


    document
        .getElementById("moodNumber")
        .textContent =
        Math.round(game.mood);

}


/* ==================================================
   알 터치
================================================== */

function touchEgg(event){

    if(
        !game.started ||
        game.hatched
    ){

        return;

    }


    game.touches++;


    const egg =
        document.getElementById("egg");


    egg.classList.remove(
        "shake"
    );


    void egg.offsetWidth;


    egg.classList.add(
        "shake"
    );


    createEffect(
        event,
        random([
            "♡",
            "✦",
            "•ᴗ•",
            "·"
        ])
    );


    if(
        game.touches === 1
    ){

        showBubble(
            "•ᴗ•"
        );

    }

    else if(
        game.touches === 2
    ){

        showBubble(
            "*⸌☻ັ⸍*"
        );

    }

    else if(
        game.touches === 3
    ){

        showBubble(
            "ᵔᴥᵔ"
        );

    }

    else if(
        game.touches === 4
    ){

        showBubble(
            "ฅ^•ﻌ•^ฅ"
        );

    }

    else if(
        game.touches >= 5
    ){

        hatch();

    }

}


/* ==================================================
   부화
================================================== */

function hatch(){

    if(game.hatched){

        return;

    }


    game.hatched=true;

    game.level=2;


    document
        .getElementById("egg")
        .classList
        .add("hidden");


    document
        .getElementById("owl")
        .classList
        .add("show");


    document
        .getElementById("levelText")
        .textContent =
        "Lv. 2";


    showBubble(
        "✦"
    );


    setTimeout(function(){

        showBubble(
            "-`♥´-"
        );

    },900);

}


/* ==================================================
   부엉이 터치
================================================== */

function touchOwl(event){

    if(
        !game.started ||
        !game.hatched
    ){

        return;

    }


    game.mood += 7;

    game.hp += 1;


    const owl =
        document.getElementById("owl");


    owl.classList.remove(
        "jump"
    );


    void owl.offsetWidth;


    owl.classList.add(
        "jump"
    );


    createEffect(
        event,
        random([
            "♥",
            "♡",
            "✦",
            "-`♥´-",
            "•ᴗ•"
        ])
    );


    showBubble(
        random([
            "*⸌☻ັ⸍*",
            "-`♥´-",
            "•ᴗ•",
            "ᵔᴥᵔ",
            "ฅ^•ﻌ•^ฅ",
            "♡",
            "✦"
        ])
    );


    updateStats();

}


/* ==================================================
   먹이주기
================================================== */

function feed(){

    if(!game.hatched){

        showBubble(
            "•︵•"
        );

        return;

    }


    game.hunger += 18;

    game.hp += 3;

    game.mood += 3;


    showBubble(
        random([
            "ฅ^•ﻌ•^ฅ",
            "๑•̀ᗝ•́๑",
            "♡",
            "*⸌☻ັ⸍*"
        ])
    );


    createCenterEffect(
        "♥"
    );


    updateStats();

}


/* ==================================================
   놀아주기
================================================== */

function play(){

    if(!game.hatched){

        showBubble(
            "•︵•"
        );

        return;

    }


    game.mood += 18;

    game.hunger -= 5;


    showBubble(
        random([
            "ᵔᴥᵔ",
            "•̀ᴗ•́",
            "✦",
            "ฅ^•ﻌ•^ฅ",
            "*⸌☻ັ⸍*"
        ])
    );


    createCenterEffect(
        "✦"
    );


    updateStats();

}


/* ==================================================
   쓰다듬기
================================================== */

function pet(){

    if(!game.hatched){

        showBubble(
            "•︵•"
        );

        return;

    }


    game.mood += 10;

    game.hp += 2;


    showBubble(
        random([
            "-`♥´-",
            "♡",
            "*⸌☻ັ⸍*",
            "•ᴗ•",
            "ᵔᴥᵔ"
        ])
    );


    createCenterEffect(
        "♥"
    );


    updateStats();

}


/* ==================================================
   말풍선
================================================== */

let bubbleTimer = null;


function showBubble(text){

    const bubble =
        document.getElementById(
            "bubble"
        );


    bubble.textContent =
        text;


    bubble.classList.add(
        "show"
    );


    clearTimeout(
        bubbleTimer
    );


    bubbleTimer =
        setTimeout(function(){

            bubble.classList.remove(
                "show"
            );

        },1300);

}


/* ==================================================
   터치 이펙트
================================================== */

function createEffect(
    event,
    text
){

    const room =
        document.getElementById(
            "room"
        );


    const rect =
        room.getBoundingClientRect();


    const x =
        event.clientX -
        rect.left;


    const y =
        event.clientY -
        rect.top;


    const effect =
        document.createElement(
            "div"
        );


    effect.className =
        "effect";


    effect.textContent =
        text;


    effect.style.left =
        x + "px";


    effect.style.top =
        y + "px";


    room.appendChild(
        effect
    );


    setTimeout(function(){

        effect.remove();

    },800);

}


/* ==================================================
   중앙 이펙트
================================================== */

function createCenterEffect(
    text
){

    const room =
        document.getElementById(
            "room"
        );


    const effect =
        document.createElement(
            "div"
        );


    effect.className =
        "effect";


    effect.textContent =
        text;


    effect.style.left =
        "50%";


    effect.style.top =
        "40%";


    room.appendChild(
        effect
    );


    setTimeout(function(){

        effect.remove();

    },800);

}


/* ==================================================
   랜덤
================================================== */

function random(array){

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];

}


/* ==================================================
   시간 경과
================================================== */

setInterval(function(){

    if(
        !game.started
    ){

        return;

    }


    game.hunger -= .35;

    game.mood -= .15;


    if(
        game.hunger < 20
    ){

        game.mood -= .15;

    }


    if(
        game.hunger < 10
    ){

        game.hp -= .2;

    }


    updateStats();

},5000);


/* ==================================================
   초기화
================================================== */

updateStats();

</script>
