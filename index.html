<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no,
    viewport-fit=cover"
>

<title>부엉이 키우기</title>

<style>

/* ==================================================
   기본
================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#1b1512;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
}


/* ==================================================
   게임 전체
================================================== */

#game{
    position:relative;

    width:min(100vw,620px);
    aspect-ratio:1 / 1;

    overflow:hidden;

    background:#c99f75;

    touch-action:manipulation;

    user-select:none;
    -webkit-user-select:none;

    image-rendering:auto;
}


/* ==================================================
   배경
================================================== */

#background{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:1;

    pointer-events:none;
}


/* ==================================================
   소품
================================================== */

#props{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:3;

    pointer-events:none;
}

.prop{
    position:absolute;

    object-fit:contain;

    pointer-events:none;
}


/* 선반 */

#shelf{
    width:31%;

    right:6.5%;
    top:15%;
}


/* 램프 */

#lamp{
    width:22%;

    right:2.5%;
    top:5%;
}


/* 화분 */

#plant{
    width:23%;

    left:7%;
    bottom:25%;
}


/* 세워진 책 */

#booksStanding{
    width:22%;

    left:31%;
    bottom:22%;
}


/* 눕혀진 책 */

#booksHorizontal{
    width:18%;

    left:29%;
    bottom:17%;
}


/* 쪽지 */

#note{
    width:15%;

    right:19%;
    top:24%;
}


/* ==================================================
   둥지
================================================== */

#nest{
    position:absolute;

    width:39%;

    left:50%;
    bottom:19%;

    transform:translateX(-50%);

    z-index:5;

    pointer-events:none;
}


/* ==================================================
   부엉이
================================================== */

#owlArea{
    position:absolute;

    width:38%;
    height:34%;

    left:50%;
    bottom:22%;

    transform:translateX(-50%);

    z-index:7;

    display:flex;

    justify-content:center;
    align-items:flex-end;

    pointer-events:auto;

    cursor:pointer;
}


#owl{
    width:auto;
    height:auto;

    max-width:100%;
    max-height:100%;

    object-fit:contain;

    pointer-events:none;

    filter:
        drop-shadow(
            0 3px 0 rgba(74,45,31,.16)
        );

    transition:
        transform .16s ease,
        opacity .16s ease;
}


/* 부엉이 터치 */

#owl.jump{
    transform:
        translateY(-7px)
        scale(1.04);
}


/* ==================================================
   말풍선
================================================== */

#bubble{
    position:absolute;

    left:50%;
    bottom:51%;

    transform:
        translateX(-50%)
        scale(.75);

    min-width:85px;

    padding:
        10px 15px
        11px;

    background:#fff8e8;

    border:
        3px solid #58392b;

    border-radius:17px;

    color:#3c271f;

    font-size:20px;
    font-weight:900;

    line-height:1;

    text-align:center;

    box-shadow:
        0 3px 0
        rgba(72,43,31,.18);

    opacity:0;

    pointer-events:none;

    z-index:20;

    transition:
        opacity .15s ease,
        transform .15s ease;
}


#bubble.show{
    opacity:1;

    transform:
        translateX(-50%)
        scale(1);
}


/* ==================================================
   효과
================================================== */

#effects{
    position:absolute;

    inset:0;

    z-index:15;

    pointer-events:none;

    overflow:hidden;
}


.effect{
    position:absolute;

    width:14%;

    height:auto;

    object-fit:contain;

    animation:
        effectPop
        .8s
        ease-out
        forwards;
}


@keyframes effectPop{

    0%{
        opacity:0;

        transform:
            scale(.35)
            translateY(12px);
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
            scale(1.15)
            translateY(-32px);
    }

}


/* ==================================================
   버튼
================================================== */

#buttons{
    position:absolute;

    left:4.5%;
    right:4.5%;
    bottom:3%;

    height:20%;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:2.5%;

    z-index:30;
}


.action{
    border:0;

    padding:0;

    margin:0;

    background:transparent;

    display:flex;

    justify-content:center;
    align-items:center;

    touch-action:manipulation;

    cursor:pointer;
}


.action img{
    width:100%;
    height:100%;

    object-fit:contain;

    filter:
        drop-shadow(
            0 2px 0
            rgba(71,43,31,.15)
        );

    transition:
        transform .1s ease;
}


.action:active img{
    transform:scale(.93);
}


/* ==================================================
   시작 화면
================================================== */

#startScreen{
    position:absolute;

    inset:0;

    z-index:100;

    display:flex;

    justify-content:center;
    align-items:center;

    background:
        rgba(
            42,
            26,
            20,
            .25
        );
}


#startCard{
    width:70%;

    padding:
        25px 20px 22px;

    background:#fff4de;

    border:
        4px solid #62402f;

    border-radius:25px;

    box-shadow:
        0 6px 0
        rgba(69,42,30,.25);

    text-align:center;

    color:#4b3023;
}


#startEgg{
    display:block;

    width:34%;
    max-width:130px;

    margin:
        0 auto
        10px;
}


#startTitle{
    font-size:
        clamp(
            22px,
            5vw,
            34px
        );

    font-weight:900;

    margin-bottom:5px;
}


#startSub{
    font-size:
        clamp(
            12px,
            2.7vw,
            17px
        );

    font-weight:700;

    opacity:.72;

    margin-bottom:18px;
}


#startButton{
    border:
        3px solid #62402f;

    border-radius:15px;

    background:#e9c899;

    color:#4b3023;

    padding:
        10px 23px;

    font-size:
        clamp(
            15px,
            3.6vw,
            20px
        );

    font-weight:900;

    box-shadow:
        0 3px 0
        #8b6448;

    cursor:pointer;
}


#startButton:active{
    transform:translateY(2px);

    box-shadow:
        0 1px 0
        #8b6448;
}


/* ==================================================
   작은 화면
================================================== */

@media(max-width:430px){

    #game{
        width:100vw;
        height:100vw;
    }

}


/* ==================================================
   화면이 너무 세로로 길 경우
================================================== */

@media(max-height:500px){

    #game{
        width:100vh;
        height:100vh;
    }

}

</style>

</head>


<body>


<div id="game">


    <!-- ==========================================
         배경
    =========================================== -->

    <img
        id="background"
        src="bg_day.png"
        alt=""
    >


    <!-- ==========================================
         소품
    =========================================== -->

    <div id="props">


        <img
            id="shelf"
            class="prop"
            src="shelf.png"
            alt=""
        >


        <img
            id="lamp"
            class="prop"
            src="lamp.png"
            alt=""
        >


        <img
            id="plant"
            class="prop"
            src="plant.png"
            alt=""
        >


        <img
            id="booksStanding"
            class="prop"
            src="books_standing.png"
            alt=""
        >


        <img
            id="booksHorizontal"
            class="prop"
            src="books_horizontal.png"
            alt=""
        >


        <img
            id="note"
            class="prop"
            src="note.png"
            alt=""
        >


    </div>


    <!-- ==========================================
         둥지
    =========================================== -->

    <img
        id="nest"
        src="nest.png"
        alt=""
    >


    <!-- ==========================================
         부엉이
    =========================================== -->

    <div id="owlArea">

        <img
            id="owl"
            src="egg.png"
            alt="부엉이"
        >

    </div>


    <!-- ==========================================
         말풍선
    =========================================== -->

    <div id="bubble"></div>


    <!-- ==========================================
         효과
    =========================================== -->

    <div id="effects"></div>


    <!-- ==========================================
         버튼
    =========================================== -->

    <div id="buttons">


        <button
            class="action"
            id="feedButton"
            type="button"
            aria-label="먹이주기"
        >

            <img
                src="button_feed.png"
                alt="먹이주기"
            >

        </button>


        <button
            class="action"
            id="playButton"
            type="button"
            aria-label="놀아주기"
        >

            <img
                src="button_play.png"
                alt="놀아주기"
            >

        </button>


        <button
            class="action"
            id="petButton"
            type="button"
            aria-label="쓰다듬기"
        >

            <img
                src="button_pet.png"
                alt="쓰다듬기"
            >

        </button>


        <button
            class="action"
            id="talkButton"
            type="button"
            aria-label="말걸기"
        >

            <img
                src="button_talk.png"
                alt="말걸기"
            >

        </button>


    </div>


    <!-- ==========================================
         시작 화면
    =========================================== -->

    <div id="startScreen">


        <div id="startCard">


            <img
                id="startEgg"
                src="egg.png"
                alt=""
            >


            <div id="startTitle">
                부엉이 키우기
            </div>


            <div id="startSub">
                작은 알에서 시작합니다
            </div>


            <button
                id="startButton"
                type="button"
            >
                시작하기
            </button>


        </div>


    </div>


</div>



<script>

/* ==================================================
   이미지 경로
================================================== */

/*
   모든 이미지가 index.html과 같은 폴더에 있으므로
   images/ 경로를 사용하지 않는다.
*/

function image(name){

    return name + ".png";

}


/* ==================================================
   DOM
================================================== */

const background =
    document.getElementById(
        "background"
    );

const owl =
    document.getElementById(
        "owl"
    );

const owlArea =
    document.getElementById(
        "owlArea"
    );

const bubble =
    document.getElementById(
        "bubble"
    );

const effects =
    document.getElementById(
        "effects"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );


/* ==================================================
   이모티콘
================================================== */

const EMOTES = {

    idle:[
        "•ᴗ•",
        "ᵔᴥᵔ",
        "*⸌☻ັ⸍*",
        "•_•",
        "◔ᴗ◔"
    ],

    feed:[
        "(๑•ᴗ•๑)",
        "ᵔڡᵔ",
        "(っ˘ڡ˘ς)",
        "•ᴗ•♡"
    ],

    play:[
        "(ง •̀ᴗ•́)ง",
        "(๑˃ᴗ˂)ﻭ",
        "٩(ˊᗜˋ*)و",
        "•ᴗ•✧"
    ],

    pet:[
        "-`♥´-",
        "(˶ᵔ ᵕ ᵔ˶)",
        "(ฅ´ω`ฅ)",
        "♡ᴗ♡"
    ],

    talk:[
        "•ᴗ•?",
        "ᵔᴥᵔ?",
        "(•ө•)？",
        "•_•?"
    ],

    sleepy:[
        "-ᴗ- zZ",
        "(－_－) zzZ",
        "ᵕᴗᵕ zZ"
    ],

    confused:[
        "•ᴗ•?",
        "(⊙_⊙)?",
        "ᵔᴥᵔ?"
    ],

    back:[
        "...",
        "ᵕ_ᵕ",
        "-_-"
    ],

    hatch:[
        "!",
        "•ᴗ•!",
        "✧ᴗ✧"
    ]

};


/* ==================================================
   성장 단계
================================================== */

const STAGES = [

    {
        key:"egg",
        file:"egg",
        clicks:0
    },

    {
        key:"cracked",
        file:"egg_cracked",
        clicks:5
    },

    {
        key:"hatching",
        file:"owl_hatching",
        clicks:7
    },

    {
        key:"baby",
        file:"owl_baby",
        clicks:9
    },

    {
        key:"normal",
        file:"owl_normal",
        clicks:16
    }

];


/* ==================================================
   저장 데이터
================================================== */

let saved =
    localStorage.getItem(
        "owlWidgetSave"
    );


let game;


if(saved){

    try{

        game =
            JSON.parse(
                saved
            );

    }catch(error){

        game = null;

    }

}


if(!game){

    game = {

        started:false,

        stage:0,

        clicks:0,

        lastAction:"idle",

        lastInteraction:
            Date.now()

    };

}


/* ==================================================
   저장
================================================== */

function save(){

    localStorage.setItem(

        "owlWidgetSave",

        JSON.stringify(game)

    );

}


/* ==================================================
   랜덤
================================================== */

function random(list){

    return list[
        Math.floor(
            Math.random()
            * list.length
        )
    ];

}


/* ==================================================
   현재 성장 단계
================================================== */

function currentStage(){

    if(
        game.stage >=
        STAGES.length - 1
    ){

        return STAGES[
            STAGES.length - 1
        ];

    }

    return STAGES[
        game.stage
    ];

}


/* ==================================================
   부엉이 변경
================================================== */

function setOwl(
    file,
    jump=false
){

    owl.src =
        image(file);


    if(jump){

        owl.classList.remove(
            "jump"
        );


        void owl.offsetWidth;


        owl.classList.add(
            "jump"
        );


        setTimeout(

            function(){

                owl.classList.remove(
                    "jump"
                );

            },

            180

        );

    }

}


/* ==================================================
   말풍선
================================================== */

let bubbleTimer = null;


function showBubble(
    text,
    duration=1100
){

    clearTimeout(
        bubbleTimer
    );


    bubble.textContent =
        text;


    bubble.classList.add(
        "show"
    );


    bubbleTimer =
        setTimeout(

            function(){

                bubble.classList.remove(
                    "show"
                );

            },

            duration

        );

}


/* ==================================================
   효과
================================================== */

function createEffect(
    file,
    x=.5,
    y=.4
){

    if(!file){

        return;

    }


    const effect =
        document.createElement(
            "img"
        );


    effect.className =
        "effect";


    effect.src =
        image(file);


    effect.style.left =
        (
            x * 100 - 7
        ) + "%";


    effect.style.top =
        (
            y * 100 - 7
        ) + "%";


    effects.appendChild(
        effect
    );


    setTimeout(

        function(){

            effect.remove();

        },

        850

    );

}


/* ==================================================
   성장 단계 변경
================================================== */

function setStage(
    stage
){

    game.stage =
        stage;


    const current =
        currentStage();


    setOwl(
        current.file
    );


    save();

}


/* ==================================================
   성장 확인
================================================== */

function checkGrowth(){

    if(
        game.stage === 0 &&
        game.clicks >= 5
    ){

        setStage(1);

        return;

    }


    if(
        game.stage === 1 &&
        game.clicks >= 7
    ){

        setStage(2);

        return;

    }


    if(
        game.stage === 2 &&
        game.clicks >= 9
    ){

        setStage(3);

        return;

    }


    if(
        game.stage === 3 &&
        game.clicks >= 16
    ){

        setStage(4);

        return;

    }

}


/* ==================================================
   알 터치
================================================== */

function hatchAction(){

    game.clicks++;

    checkGrowth();


    if(
        game.stage === 0
    ){

        setOwl(
            "egg",
            true
        );

        showBubble(
            random(
                EMOTES.idle
            )
        );

    }


    else if(
        game.stage === 1
    ){

        setOwl(
            "egg_cracked",
            true
        );

        showBubble(
            random(
                EMOTES.hatch
            )
        );

        createEffect(
            "effect_sparkle",
            .5,
            .42
        );

    }


    else if(
        game.stage === 2
    ){

        setOwl(
            "owl_hatching",
            true
        );

        showBubble(
            random(
                EMOTES.hatch
            )
        );

        createEffect(
            "effect_sparkle",
            .5,
            .4
        );

    }


    else if(
        game.stage === 3
    ){

        setOwl(
            "owl_baby",
            true
        );

        showBubble(
            random(
                EMOTES.idle
            )
        );

        createEffect(
            "effect_heart",
            .5,
            .4
        );

    }


    save();

}


/* ==================================================
   부엉이 터치
================================================== */

function owlTap(){

    if(
        !game.started
    ){

        return;

    }


    game.lastInteraction =
        Date.now();


    /*
       아직 성장 중이면
       터치로 부화 진행
    */

    if(
        game.stage < 3
    ){

        hatchAction();

        return;

    }


    /*
       아기 이후
       터치하면 갸웃
    */

    game.clicks++;


    setOwl(
        "owl_head_tilt",
        true
    );


    showBubble(
        random(
            EMOTES.confused
        )
    );


    createEffect(
        "effect_question",
        .65,
        .28
    );


    checkGrowth();


    save();

}


/* ==================================================
   행동
================================================== */

function action(
    type
){

    if(
        !game.started
    ){

        return;

    }


    /*
       아직 아기 단계 이전이면
       버튼 행동을 막음
    */

    if(
        game.stage < 3
    ){

        showBubble(
            random(
                EMOTES.idle
            )
        );

        return;

    }


    game.lastAction =
        type;


    game.lastInteraction =
        Date.now();


    let file =
        "owl_normal";


    let emotes =
        EMOTES.idle;


    let effect =
        null;


    /* 먹이 */

    if(
        type === "feed"
    ){

        file =
            "owl_happy";

        emotes =
            EMOTES.feed;

        effect =
            "effect_water";

    }


    /* 놀기 */

    if(
        type === "play"
    ){

        file =
            "owl_excited";

        emotes =
            EMOTES.play;

        effect =
            "effect_action";

    }


    /* 쓰다듬기 */

    if(
        type === "pet"
    ){

        file =
            "owl_love";

        emotes =
            EMOTES.pet;

        effect =
            "effect_love";

    }


    /* 말걸기 */

    if(
        type === "talk"
    ){

        file =
            "owl_head_tilt";

        emotes =
            EMOTES.talk;

        effect =
            "effect_question";

    }


    setOwl(
        file,
        true
    );


    showBubble(
        random(
            emotes
        )
    );


    createEffect(
        effect,
        .5,
        .39
    );


    save();


    clearTimeout(
        idleTimer
    );


    idleTimer =
        setTimeout(

            idleOwl,

            2400

        );

}


/* ==================================================
   자동 행동
================================================== */

let idleTimer = null;


function idleOwl(){

    if(
        !game.started ||
        game.stage < 4
    ){

        return;

    }


    const hour =
        new Date()
        .getHours();


    /*
       밤에는 잠
    */

    if(
        hour >= 22 ||
        hour < 7
    ){

        setOwl(
            "owl_sleep"
        );

        showBubble(
            random(
                EMOTES.sleepy
            ),
            1400
        );

        createEffect(
            "effect_sleep",
            .67,
            .27
        );

        return;

    }


    /*
       낮 랜덤 행동
    */

    const randomValue =
        Math.random();


    if(
        randomValue < .12
    ){

        setOwl(
            "owl_back"
        );

        showBubble(
            random(
                EMOTES.back
            )
        );

    }


    else if(
        randomValue < .24
    ){

        setOwl(
            "owl_head_tilt"
        );

        showBubble(
            random(
                EMOTES.confused
            )
        );

        createEffect(
            "effect_question",
            .65,
            .28
        );

    }


    else if(
        randomValue < .35
    ){

        setOwl(
            "owl_peek"
        );

        showBubble(
            random(
                EMOTES.idle
            )
        );

    }


    else{

        setOwl(
            "owl_normal"
        );

    }

}


/* ==================================================
   낮 / 밤
================================================== */

function updateDayNight(){

    const hour =
        new Date()
        .getHours();


    /*
       밤
       19:00 ~ 05:59
    */

    const night =
        hour >= 19 ||
        hour < 6;


    if(night){

        background.src =
            image(
                "bg_night"
            );

    }

    else{

        background.src =
            image(
                "bg_day"
            );

    }


    /*
       성장 완료 후 밤이면 잠
    */

    if(
        game.started &&
        game.stage >= 4 &&
        night
    ){

        setOwl(
            "owl_sleep"
        );

    }

}


/* ==================================================
   전체 렌더
================================================== */

function render(){

    startScreen.style.display =
        game.started
            ? "none"
            : "flex";


    const current =
        currentStage();


    setOwl(
        current.file
    );


    updateDayNight();

}


/* ==================================================
   시작
================================================== */

startButton.addEventListener(

    "click",

    function(){

        game.started =
            true;


        game.lastInteraction =
            Date.now();


        /*
           처음 시작할 때
           알 상태로 초기화
        */

        if(
            game.clicks === 0
        ){

            game.stage =
                0;

        }


        save();


        render();


        showBubble(
            "•ᴗ•",
            1200
        );

    }

);


/* ==================================================
   부엉이 터치
================================================== */

owlArea.addEventListener(

    "click",

    function(){

        owlTap();

    }

);


/* ==================================================
   버튼
================================================== */

document
    .getElementById(
        "feedButton"
    )
    .addEventListener(

        "click",

        function(){

            action(
                "feed"
            );

        }

    );


document
    .getElementById(
        "playButton"
    )
    .addEventListener(

        "click",

        function(){

            action(
                "play"
            );

        }

    );


document
    .getElementById(
        "petButton"
    )
    .addEventListener(

        "click",

        function(){

            action(
                "pet"
            );

        }

    );


document
    .getElementById(
        "talkButton"
    )
    .addEventListener(

        "click",

        function(){

            action(
                "talk"
            );

        }

    );


/* ==================================================
   낮밤 체크
================================================== */

setInterval(

    updateDayNight,

    30000

);


/* ==================================================
   자동 행동
================================================== */

setInterval(

    function(){

        if(
            game.started &&
            game.stage >= 4 &&
            Date.now()
            -
            game.lastInteraction
            >
            15000
        ){

            idleOwl();

        }

    },

    12000

);


/* ==================================================
   시작
================================================== */

render();

</script>
